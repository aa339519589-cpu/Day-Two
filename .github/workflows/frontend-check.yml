name: Frontend refinement verification
on:
  push:
    branches: [design/day-two-refinement]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed frontend source
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path('.')
          workflow=root/'.github/workflows/frontend-check.yml'
          pathlib.Path('/tmp/bootstrap-workflow.yml').write_bytes(workflow.read_bytes())
          parts=[root/f'.github/frontend-refinement/part-{i}.b64' for i in (1,2,3)]
          packed=base64.b64decode(''.join(p.read_text().strip() for p in parts))
          assert hashlib.sha256(packed).hexdigest()=='cf511f725473ac372a934625bb4e1f14123a84e0ac05c99a49592aaf12d1c3f1'
          files=json.loads(lzma.decompress(packed))
          profile=next(f for f in files if f['path']=='src/pages/Profile.tsx')
          old='<label>简介<textarea value={draft.bio}'
          assert old in profile['content']
          profile['content']=profile['content'].replace(old,'<label>简介<textarea aria-label="简介" value={draft.bio}')
          replacements=[
            ("import { chromium, webkit } from 'playwright'", "import { chromium, webkit } from 'playwright'\nimport { expect } from '@playwright/test'"),
            ("assert.equal(await page.locator('.friend-window').count(),3)", "await expect(page.locator('.friend-window')).toHaveCount(3)"),
            ("assert.equal(await page.locator('.draft').count(),1)", "await expect(page.locator('.draft')).toBeVisible()"),
            ("assert.equal(await page.locator('.draft').count(),0)", "await expect(page.locator('.draft')).toHaveCount(0)"),
            ("assert.equal(await page.getByText('这张照片好舒服。',{exact:true}).count(),1)", "await expect(page.getByText('这张照片好舒服。',{exact:true})).toBeVisible()"),
            ("assert.equal(await page.locator('dialog[open]').count(),1)", "await expect(page.locator('dialog[open]')).toBeVisible()"),
            ("assert.equal(await page.locator('dialog[open]').count(),0)", "await expect(page.locator('dialog[open]')).toHaveCount(0)"),
            ("assert.equal(await page.getByText('已暂停',{exact:true}).count(),1)", "await expect(page.getByText('已暂停',{exact:true})).toBeVisible()"),
            ("await page.getByRole('link',{name:'消息',exact:true}).click()", "await page.getByRole('link',{name:'消息',exact:true}).click();await page.waitForSelector('.threads')"),
            ("await page.getByRole('link',{name:'朋友',exact:true}).click()", "await page.getByRole('link',{name:'朋友',exact:true}).click();await page.waitForSelector('.friend-window')"),
            ("await screenshot('failure')", "await screenshot('failure');await writeFile(`${out}/${engine}-failure.html`,await page.content());await writeFile(`${out}/${engine}-failure-url.txt`,page.url())")
          ]
          tests=next(f for f in files if f['path']=='scripts/ui-smoke.mjs')
          for old,new in replacements:
              assert old in tests['content'],old
              tests['content']=tests['content'].replace(old,new)
          allowed={'index.html','vite.config.ts','.github/workflows/frontend-check.yml','scripts/ui-smoke.mjs'}
          for f in files:
              p=pathlib.Path(f['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert f['path'] in allowed or f['path'].startswith('src/')
              if f['before']:
                  assert p.exists() and hashlib.sha256(p.read_bytes()).hexdigest()==f['before'],f'Concurrent edit: {p}'
              elif p.exists() and str(p)!='.github/workflows/frontend-check.yml':
                  raise RuntimeError(f'Unexpected existing file: {p}')
          for f in files:
              p=pathlib.Path(f['path']);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(f['content'])
          pathlib.Path('/tmp/frontend-paths.json').write_text(json.dumps([f['path'] for f in files]))
          pathlib.Path('ui-artifacts').mkdir(exist_ok=True)
          pathlib.Path('ui-artifacts/expected.json').write_text(json.dumps({f['path']:hashlib.sha256(f['content'].encode()).hexdigest() for f in files},indent=2))
          print('Applied',len(files),'reviewed files')
          PY
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browsers
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.57.0
          npx playwright install --with-deps chromium webkit
      - name: Verify mobile interactions
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/day-two-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          node scripts/ui-smoke.mjs
      - name: Commit verified frontend on design branch
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          workflow='.github/workflows/frontend-check.yml'
          pathlib.Path(workflow).write_bytes(pathlib.Path('/tmp/bootstrap-workflow.yml').read_bytes())
          paths=[p for p in json.loads(pathlib.Path('/tmp/frontend-paths.json').read_text()) if p!=workflow]
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','rm','--','.github/frontend-refinement/part-1.b64','.github/frontend-refinement/part-2.b64','.github/frontend-refinement/part-3.b64'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Redesign Day Two mobile frontend with immersive photos and concise native-style interactions'],check=True)
          subprocess.run(['git','push','origin','HEAD:design/day-two-refinement'],check=True)
          pathlib.Path('ui-artifacts/commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-review
          path: ui-artifacts/
          retention-days: 7
